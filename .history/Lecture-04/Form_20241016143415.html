<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <div class="form-content">
        <form action="" id="formContents" >
            <div class="fname">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="fname">
            </div>
            <br>
            <div class="lname">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lname">
            </div>
            <br>
            <div class="email">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <br>
            <div class="password">
                <label for="password">Password</label>
                <input type="password" id="password" name="pdw">
            </div>
            <br>
            <div class="gender">
                <label for="gender">Gender</label>
                    <input type="radio" id="gen" name="gen" value="male">
                    <label for="gen">Male</label>
                    <input type="radio" id="gen" name="gen" value="female">
                    <label for="gen">Female</label>
            </div>
            <br>
            <div class="dob">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">    
            </div>
            <br>
            <div class="addres">
                <label for="address">Address</label>
                <input type="" id="address" name="address">
            </div>
            <br>
            <div class="occupation">
                <label for="occupation">Occupation</label>
                <select name="occupation" id="occupation" name ="ocpsn" required>
                    <option value="none">select an occupation</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="engineer">Engineer</option>
                    <option value="doctor">Doctor</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <br>
            <button id="submit" type="submit" onclick="nextPage()">Submit</button>
            <button id="reset" type="reset"onclick="resetPage()">Reset</button>
        </form>
        <script>
            var clear = document.getElementsByClassName("form-contents")
            var btn = document.getElementById("submit");
            var btn1 = document.getElementById("reset")
            function nextPage(){
                alert("Form Submitted")
                }
            function resetPage(){
                clear.value = ""
                console.log("Reset")
            }
        </script>
    </div>
</body>

</html>
